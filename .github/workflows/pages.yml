name: Website prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript und Funktionen prüfen
        run: |
          node --check dist/app.mjs
          node --check dist/logic.mjs
          node --check dist/menu.mjs
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
